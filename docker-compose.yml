services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aiscore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}
      POSTGRES_DB: aiscore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # On a first run Postgres initialises, shuts down, and restarts. Without
    # this healthcheck the api container connects during that gap and exits
    # with "Connection refused". pg_isready reports ready only after the
    # final start, so the api waits for the real one.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiscore -d aiscore"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://aiscore:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}@db:5432/aiscore
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
